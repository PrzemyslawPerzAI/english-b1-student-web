name: Frontend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/validate.cjs
      - run: node tests/quiz-submit.cjs
      - name: Browser acceptance when supplied by an agent candidate
        if: hashFiles('tests/learning-progress.cjs') != ''
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$PWD/node_modules/.cache/pw-browsers" npx --no-install playwright install --with-deps chromium
          sudo unshare --net -- env PLAYWRIGHT_BROWSERS_PATH="$PWD/node_modules/.cache/pw-browsers" node tests/learning-progress.cjs
