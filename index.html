<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#f7f9fc;--ink:#10182d;--muted:#60708a;--green:#13a653;--blue:#1478f5;--orange:#ff7614;--purple:#7a31ee}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;overflow-x:hidden}button,a{font:inherit}.hidden{display:none!important}
.app{width:100%;max-width:none;min-height:100dvh;margin:0;padding:clamp(20px,4.5vw,34px) clamp(16px,3.8vw,28px) 42px}.top{padding:clamp(16px,3.5vw,26px) 2px clamp(24px,5vw,36px)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:clamp(36px,8vw,58px);line-height:1.05;letter-spacing:-1.5px}.sun{font-size:clamp(40px,8vw,58px)}.sub{margin-top:12px;color:var(--muted);font-size:clamp(18px,4vw,27px);line-height:1.35}
.home-actions{display:flex;flex-direction:column;gap:clamp(16px,3.6vw,23px)}.menu-card{width:100%;height:auto;min-height:clamp(170px,20dvh,210px);border:2px solid;border-radius:clamp(20px,4vw,30px);padding:clamp(24px,5.5vw,36px);display:grid;grid-template-columns:clamp(72px,15vw,96px) minmax(0,1fr) 32px;align-items:center;gap:clamp(14px,3vw,22px);text-align:left;text-decoration:none;cursor:pointer}
.menu-card.green{background:#effbf3;border-color:#b4e8c5;color:#096f35}.menu-card.blue{background:#eef6ff;border-color:#b4d8ff;color:#123d84}.menu-card.orange{background:#fff4e9;border-color:#ffcda5;color:#812b0c}.menu-card.purple{background:#f6efff;border-color:#d8bdff;color:#3b205f}
.menu-icon{width:clamp(72px,15vw,96px);height:clamp(72px,15vw,96px);border-radius:clamp(14px,3vw,20px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(32px,6.5vw,44px)}.green .menu-icon{background:var(--green)}.blue .menu-icon{background:var(--blue)}.orange .menu-icon{background:var(--orange)}.purple .menu-icon{background:var(--purple)}
.menu-copy{min-width:0}.menu-title{display:block;font-size:clamp(25px,5.6vw,36px);line-height:1.08;font-weight:900}.menu-sub{display:block;margin-top:7px;color:#52617a;font-size:clamp(18px,4.1vw,25px);line-height:1.25}.chev{font-size:clamp(34px,7vw,48px)}
.progress-card{margin-top:clamp(18px,4vw,28px);min-height:clamp(136px,15dvh,166px);background:#fff;border-radius:clamp(20px,4vw,28px);padding:clamp(17px,3.5vw,25px);display:flex;align-items:center;gap:clamp(14px,3vw,20px);box-shadow:0 6px 20px rgba(30,45,75,.08)}.progress-icon{font-size:clamp(36px,7vw,50px)}.progress-title{font-size:clamp(21px,4.7vw,30px);font-weight:900}.progress-sub{margin-top:5px;color:var(--muted);font-size:clamp(15px,3.4vw,21px)}
.page-head{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:10px 0 22px}.back{width:52px;height:52px;border:0;background:none;color:var(--ink);font-size:46px;line-height:1;cursor:pointer}.page-title{text-align:center;font-size:clamp(32px,7vw,42px);font-weight:900;letter-spacing:-.8px}
.level-card{margin:14px 0;background:#fff;border:1px solid #e2e8f1;border-radius:20px;overflow:hidden;box-shadow:0 5px 16px rgba(30,45,75,.07)}
.level-head{width:100%;border:0;display:grid;grid-template-columns:20px minmax(0,1fr) 32px;align-items:center;gap:12px;padding:clamp(20px,4.5vw,28px) clamp(20px,4.5vw,30px);text-align:left;font-size:clamp(25px,5.7vw,34px);font-weight:900;cursor:pointer}.dot{width:17px;height:17px;border-radius:50%}.fold{font-size:28px;text-align:right;line-height:1;transition:transform .18s}.level-card.collapsed .fold{transform:rotate(180deg)}.level-card.collapsed .level-body{display:none}
.level-a .level-head{background:#eaf9ee;color:#128342}.level-a .dot{background:var(--green)}.level-b1 .level-head{background:#edf5ff;color:#1268da}.level-b1 .dot{background:var(--blue)}.level-b2 .level-head{background:#f4ecff;color:#6e2ddd}.level-b2 .dot{background:var(--purple)}
.word{padding:clamp(22px,5vw,32px) clamp(20px,4.5vw,30px);border-bottom:1px solid #e5eaf1}.word:last-child{border-bottom:0}.word-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.en{font-size:clamp(31px,7vw,42px);line-height:1.15;font-weight:900}.pl{margin-top:8px;color:#526079;font-size:clamp(23px,5.3vw,32px);line-height:1.3}.ex{margin-top:7px;color:#56657e;font-size:clamp(21px,4.8vw,29px);font-style:italic;line-height:1.45}.speak{width:clamp(42px,9vw,54px);height:clamp(42px,9vw,54px);border:0;border-radius:50%;background:#edf4ff;font-size:clamp(23px,5.2vw,31px);cursor:pointer}
.scope-switch{display:grid;grid-template-columns:1fr 1fr;background:#e8ecf3;border-radius:14px;padding:3px;margin-bottom:15px}.scope-btn{border:0;background:transparent;color:#4c596f;padding:clamp(15px,3.5vw,20px) 6px;border-radius:11px;font-size:clamp(19px,4.4vw,26px);font-weight:900}.scope-btn.active{background:var(--blue);color:#fff}
.filter-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:17px}.filter-btn{min-height:clamp(58px,8vh,72px);border:2px solid #dbe2ec;background:#fff;color:#6c7688;border-radius:14px;padding:9px 5px;font-size:clamp(16px,3.8vw,22px);font-weight:900}.filter-btn.active::before{content:'✓ ';font-weight:900}.filter-btn.active.filter-a{background:#e8f8ee;border-color:#71d799;color:#147c40}.filter-btn.active.filter-b1{background:#edf5ff;border-color:#7db9ff;color:#1268da}.filter-btn.active.filter-b2{background:#f4ecff;border-color:#c59aff;color:#6e2ddd}
.loading{text-align:center;padding-top:30vh;color:var(--muted);font-size:20px}.error{margin:20px;padding:18px;border-radius:16px;background:#fff0f0;color:#a33131}
@media(pointer:coarse){
.app{width:100%!important;max-width:none!important;margin:0!important}
.menu-card{width:100%!important}
}
@media(max-width:380px){.app{padding-left:14px;padding-right:14px}h1{font-size:36px}.sub{font-size:18px}.menu-card{min-height:126px;padding:18px;grid-template-columns:58px minmax(0,1fr) 22px;gap:13px}.menu-icon{width:58px;height:58px;font-size:28px}.menu-title{font-size:22px}.menu-sub{font-size:16px}.page-title{font-size:30px}.level-head{font-size:21px}.en{font-size:25px}.pl{font-size:19px}.ex{font-size:17px}}
@media(min-width:1000px) and (pointer:fine){.app{max-width:760px;margin:0 auto;padding-top:30px}.menu-card{min-height:145px}}

.login{max-width:560px;margin:18vh auto 0;background:#fff;border-radius:28px;padding:32px;box-shadow:0 6px 20px rgba(30,45,75,.08)}.login h2{margin:0 0 8px;font-size:36px}.login p{color:var(--muted);font-size:19px}.login input{width:100%;padding:16px;border:2px solid #dbe2ec;border-radius:14px;font-size:24px}.login button{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;font-size:20px}.login-msg{margin-top:10px;color:#a33131}
.quiz-meta{margin:0 0 18px;padding:16px 18px;background:#edf5ff;border:1px solid #b4d8ff;border-radius:16px;color:#31527d;font-size:16px;line-height:1.4}.quiz-card{margin:14px 0;background:#fff;border:1px solid #e2e8f1;border-radius:20px;padding:22px;box-shadow:0 5px 16px rgba(30,45,75,.07)}.quiz-no{color:#1478f5;font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}.quiz-q{font-size:clamp(22px,4.8vw,30px);font-weight:900;line-height:1.25}.quiz-option{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px 16px;border:2px solid #e1e8f2;border-radius:14px;font-size:clamp(17px,3.8vw,22px);cursor:pointer}.quiz-option:has(input:checked){background:#edf5ff;border-color:#1478f5;color:#123d84}.quiz-option input{width:20px;height:20px;accent-color:#1478f5}.quiz-input{width:100%;margin-top:14px;padding:15px 16px;font-size:20px;border:2px solid #dbe3ef;border-radius:14px;outline:none}.quiz-input:focus{border-color:#1478f5}.quiz-submit{width:100%;margin-top:20px;min-height:64px;border:0;border-radius:16px;background:#1478f5;color:#fff;font-size:21px;font-weight:900;cursor:pointer}.quiz-submit:disabled{opacity:.6}
/* Mobile density override: keep Apps Script visual language, correct external-browser scaling */
@media(max-width:600px){
 .app{padding:16px 14px 30px}
 .top{padding:12px 2px 20px}
 h1{font-size:34px;letter-spacing:-1px}.sun{font-size:36px}.sub{margin-top:8px;font-size:17px}
 .home-actions{gap:12px}
 .menu-card{min-height:112px;border-radius:20px;padding:16px 17px;grid-template-columns:56px minmax(0,1fr) 20px;gap:13px}
 .menu-icon{width:56px;height:56px;border-radius:14px;font-size:27px}
 .menu-title{font-size:21px;line-height:1.12}.menu-sub{margin-top:4px;font-size:15px}.chev{font-size:29px}
 .progress-card{margin-top:14px;min-height:96px;border-radius:20px;padding:15px;gap:12px}
 .progress-icon{font-size:31px}.progress-title{font-size:20px}.progress-sub{font-size:14px}
 .page-head{grid-template-columns:42px 1fr 42px;padding:5px 0 15px}.back{width:42px;height:42px;font-size:38px}.page-title{font-size:27px}
 .level-card{margin:10px 0;border-radius:16px}.level-head{grid-template-columns:14px minmax(0,1fr) 24px;gap:9px;padding:16px 17px;font-size:20px}.dot{width:13px;height:13px}.fold{font-size:22px}
 .word{padding:17px}.en{font-size:25px}.pl{margin-top:5px;font-size:19px}.ex{margin-top:5px;font-size:17px}.speak{width:40px;height:40px;font-size:21px}
 .scope-btn{padding:12px 5px;font-size:16px}.filter-btn{min-height:50px;font-size:14px}
 .quiz-meta{font-size:14px;padding:13px 14px}.quiz-card{padding:17px;border-radius:16px}.quiz-q{font-size:20px}.quiz-option{padding:11px 12px;font-size:17px}.quiz-input{padding:12px 13px;font-size:18px}.quiz-submit{min-height:56px;font-size:18px}
}

/* Compact all secondary views on phones to the same density as the home screen */
@media(max-width:600px){
 #words,#quiz,#vocabularyHistory{padding-top:0}
 #wordList,#historyWordList,#quizList{width:100%}
 #words .level-card,#vocabularyHistory .level-card{margin:8px 0}
 #words .level-head,#vocabularyHistory .level-head{padding:13px 15px;font-size:18px}
 #words .word,#vocabularyHistory .word{padding:14px 15px}
 #words .en,#vocabularyHistory .en{font-size:22px}
 #words .pl,#vocabularyHistory .pl{font-size:17px;line-height:1.25}
 #words .ex,#vocabularyHistory .ex{font-size:15px;line-height:1.35}
 #words .speak,#vocabularyHistory .speak{width:36px;height:36px;font-size:18px}
 #vocabularyHistory .scope-switch{margin-bottom:10px;border-radius:11px}
 #vocabularyHistory .scope-btn{padding:10px 4px;font-size:15px}
 #vocabularyHistory .filter-bar{gap:5px;margin-bottom:11px}
 #vocabularyHistory .filter-btn{min-height:43px;padding:6px 3px;border-radius:11px;font-size:12px}
 #quiz .quiz-meta{margin-bottom:10px;padding:11px 12px;border-radius:12px;font-size:13px}
 #quiz .quiz-card{margin:9px 0;padding:14px 15px;border-radius:15px}
 #quiz .quiz-no{font-size:11px;margin-bottom:5px}
 #quiz .quiz-q{font-size:18px;line-height:1.25}
 #quiz .quiz-option{gap:9px;margin-top:7px;padding:10px 11px;border-radius:11px;font-size:15px}
 #quiz .quiz-option input{width:17px;height:17px}
 #quiz .quiz-input{margin-top:10px;padding:11px 12px;font-size:16px;border-radius:11px}
 #quiz .quiz-submit{margin-top:13px;min-height:50px;border-radius:13px;font-size:16px}
 #quiz .progress-card{min-height:82px}
}

@media(max-width:600px){#words .en,#vocabularyHistory .en{font-size:20px}#words .pl,#vocabularyHistory .pl{font-size:16px}#words .ex,#vocabularyHistory .ex{font-size:14px}#words .word,#vocabularyHistory .word{padding:12px 14px}}

/* Compact phone typography — closer to the approved DEV visual proportions */
@media(max-width:600px){
 h1{font-size:29px}.sun{font-size:31px}.sub{font-size:15px}
 .menu-title{font-size:18px}.menu-sub{font-size:13px}.chev{font-size:25px}
 .progress-title{font-size:17px}.progress-sub{font-size:12px}.progress-icon{font-size:27px}
 .page-title{font-size:23px}.back{font-size:34px}
 #words .level-head,#vocabularyHistory .level-head{font-size:16px}
 #words .en,#vocabularyHistory .en{font-size:18px}
 #words .pl,#vocabularyHistory .pl{font-size:14px}
 #words .ex,#vocabularyHistory .ex{font-size:13px}
 #vocabularyHistory .scope-btn{font-size:13px}
 #vocabularyHistory .filter-btn{font-size:11px}
 #quiz .quiz-meta{font-size:12px}
 #quiz .quiz-no{font-size:10px}
 #quiz .quiz-q{font-size:16px}
 #quiz .quiz-option{font-size:14px}
 #quiz .quiz-input{font-size:15px}
 #quiz .quiz-submit{font-size:15px}
}

#learningProgress{max-width:1100px;margin:auto;overflow-wrap:anywhere}
#learningProgress .page-head{grid-template-columns:52px minmax(0,1fr)}
#learningProgress .page-title{font-size:clamp(22px,5vw,34px);letter-spacing:normal}
.lp-counters,.lp-batches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:16px}
.lp-counter,.lp-set,.lp-batch{padding:16px;background:#fff;border:1px solid #d9e0ea;border-radius:16px;min-width:0}
.lp-counter strong{display:block;font-size:28px}.lp-set{margin-top:20px}.lp-set h2{margin-top:0}
.lp-track{height:20px;background:#e8ecf3;border-radius:8px;overflow:hidden;margin:12px 0}
.lp-fill{height:100%;background:#758094}.lp-high .lp-fill{background:#16843e}.lp-mid .lp-fill{background:#ba8100}.lp-low .lp-fill{background:#bf3434}
.lp-column{height:120px;display:flex;align-items:flex-end;max-width:68px;margin:12px auto;background:#e8ecf3;border-radius:6px;overflow:hidden}.lp-column .lp-fill{width:100%}
.lp-up{color:#12652e}.lp-down{color:#a32525}.lp-flat{color:#46536a}
.lp-note{color:#526079;line-height:1.5}.lp-state{padding:20px 0;line-height:1.5}
#learningProgress summary{cursor:pointer;padding:20px 0;font-weight:bold}
#learningProgress button:focus-visible,#learningProgress summary:focus-visible,#learningProgressBtn:focus-visible{outline:3px solid #123d84;outline-offset:4px}
</style>
</head>
<body>
<div class="app">
<div id="loading" class="loading">Ładowanie English B1…</div><div id="error" class="error hidden"></div><section id="login" class="login hidden"><h2>English B1</h2><p>Wpisz rodzinny PIN dostępu.</p><form id="loginForm"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN" required><button type="submit">WEJDŹ</button></form><div id="loginMsg" class="login-msg"></div></section>
<section id="home" class="hidden">
 <div class="top"><div class="toprow"><h1>Cześć <span id="learner"></span>!</h1><span class="sun">☀️</span></div><div class="sub">Kontynuuj swoją naukę angielskiego B1 💪</div></div>
 <div class="home-actions">
  <button class="menu-card green" onclick="showWords()"><span class="menu-icon">📖</span><span class="menu-copy"><span class="menu-title">UCZĘ SIĘ SŁÓWEK</span><span class="menu-sub">Słowa z aktualnego setu</span></span><span class="chev">›</span></button>
  <button id="quizBtn" class="menu-card blue" onclick="showQuiz()"><span class="menu-icon">🧠</span><span class="menu-copy"><span class="menu-title">QUIZ ZE SŁÓWEK</span><span class="menu-sub">Sprawdź swoją wiedzę</span></span><span class="chev">›</span></button>
  <a id="audioBtn" class="menu-card orange" target="_blank"><span class="menu-icon">🎧</span><span class="menu-copy"><span class="menu-title">SŁUCHAM MP3</span><span class="menu-sub">Pełna sesja do nauki</span></span><span class="chev">›</span></a>
  <button class="menu-card purple" onclick="showVocabularyHistory()"><span class="menu-icon">☷</span><span class="menu-copy"><span class="menu-title">WSZYSTKIE SŁÓWKA</span><span class="menu-sub">Zobacz wszystkie wysłane słowa</span></span><span class="chev">›</span></button>
  <button id="learningProgressBtn" class="menu-card blue" onclick="showLearningProgress()"><span class="menu-icon" aria-hidden="true">📊</span><span class="menu-copy"><span class="menu-title">Status postępu nauki</span><span class="menu-sub">Historia setów i batchów</span></span><span class="chev" aria-hidden="true">›</span></button>
 </div>
 <div class="progress-card"><span class="progress-icon">🏆</span><div><div class="progress-title">Twój postęp</div><div id="progressText" class="progress-sub"></div></div></div>
</section>
<section id="learningProgress" class="hidden" aria-labelledby="learningProgressTitle">
 <div class="page-head"><button id="learningProgressBack" class="back" aria-label="Powrót do ekranu głównego" onclick="returnFromLearningProgress()">‹</button><h1 id="learningProgressTitle" class="page-title" tabindex="-1">Status postępu nauki</h1></div>
 <div id="learningProgressState" class="lp-state" role="status" aria-live="polite"></div>
 <div id="learningProgressContent"></div>
</section>
<section id="words" class="hidden"><div class="page-head"><button class="back" onclick="showHome()">‹</button><div class="page-title">Słowa z setu</div><span></span></div><div id="wordList"></div></section>
<section id="quiz" class="hidden"><div class="page-head"><button class="back" onclick="showHome()">‹</button><div class="page-title">Quiz ze słówek</div><span></span></div><div id="quizList"></div><button id="checkQuizBtn" class="quiz-submit" onclick="checkQuiz()">SPRAWDŹ WYNIK</button><div id="quizResult" class="progress-card hidden"></div></section>
<section id="vocabularyHistory" class="hidden">
 <div class="page-head"><button class="back" onclick="showHome()">‹</button><div class="page-title">Wszystkie słówka</div><span></span></div>
 <div class="scope-switch"><button id="scopeSet" class="scope-btn active" onclick="setVocabularyScope('set')">TEN SET</button><button id="scopeAll" class="scope-btn" onclick="setVocabularyScope('all')">WSZYSTKIE</button></div>
 <div class="filter-bar"><button id="filterA" class="filter-btn filter-a active" onclick="toggleLevelFilter('a')">UTRWALAM</button><button id="filterB1" class="filter-btn filter-b1 active" onclick="toggleLevelFilter('b1')">CEL B1</button><button id="filterB2" class="filter-btn filter-b2 active" onclick="toggleLevelFilter('b2')">WYZWANIE</button></div>
 <div id="historyWordList"></div>
</section>
<footer style="text-align:center;padding:28px 8px;color:#60708a"><a href="security.html" style="color:#60708a">Bezpieczeństwo i prywatność</a></footer>
</div>
<script>
let DATA=null,VOCAB_SCOPE='set',LEVEL_FILTERS={a:true,b1:true,b2:true};
let COLLAPSED={words:{a:false,b1:false,b2:false},history:{a:false,b1:false,b2:false}};
// External Student Web: visual shell is identical to the Apps Script version.
const API_URL = '/api/student';
if (API_URL) loadData();
else init({learner:'',setWeek:'—',words:[],currentSetWords:[],allSentWords:[],audioUrl:'',quizUrl:'',stats:{quizzesCompleted:0,latestQuizPercent:null,masteredTotal:0}});

function loadData(){
  fetch(API_URL,{credentials:'same-origin',cache:'no-store'})
    .then(r=>{if(r.status===401){showLogin();return null}if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(d=>{if(d)init(d)}).catch(fail);
}
function showLogin(){hidePages();loading.classList.add('hidden');error.classList.add('hidden');login.classList.remove('hidden');pin.focus()}
loginForm.addEventListener('submit',function(e){
  e.preventDefault();loginMsg.textContent='';
  fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value})})
    .then(async r=>{if(!r.ok){const x=await r.json().catch(()=>({}));throw new Error(x.error||'Logowanie nieudane')}return r.json()})
    .then(()=>{login.classList.add('hidden');loading.classList.remove('hidden');pin.value='';loadData()})
    .catch(e=>{loginMsg.textContent=e.message||'Logowanie nieudane'});
});
function init(d){DATA=d;loading.classList.add('hidden');home.classList.remove('hidden');learner.textContent=d.learner?d.learner:'';progressText.textContent='Set '+d.setWeek+' • '+d.stats.quizzesCompleted+' quizy • ostatni wynik '+(d.stats.latestQuizPercent==null?'—':d.stats.latestQuizPercent+'%')+' • '+d.stats.masteredTotal+' opanowanych';setupLink('audioBtn',d.audioUrl?('/api/audio?setWeek='+encodeURIComponent(d.setWeek)+'&batch='+encodeURIComponent(d.batch)):'');setupLink('quizBtn',d.quizUrl)}
function setupLink(id,url){const e=document.getElementById(id);if(!e)return;if(url)e.href=url;else if(e.tagName==='A'){e.style.opacity='.45';e.style.pointerEvents='none';e.removeAttribute('href')}}
function groups(){return[{key:'a',title:'UTRWALAM • A1–A2',cls:'level-a'},{key:'b1',title:'CEL B1',cls:'level-b1'},{key:'b2',title:'WYZWANIE • B2+',cls:'level-b2'}]}
function wordHtml(w){return '<div class="word"><div class="word-head"><span class="en">'+esc(w.word)+'</span><button class="speak" onclick="event.stopPropagation();speakWord(\''+jsq(w.word)+'\')">🔊</button></div><div class="pl">'+esc(w.meaning)+'</div><div class="ex">'+esc(w.example)+'</div></div>'}
function groupHtml(source,useFilters,context){
 return groups().map(g=>{if(useFilters&&!LEVEL_FILTERS[g.key])return'';const items=source.filter(w=>levelGroup(w.level)===g.key);if(!items.length)return'';const collapsed=COLLAPSED[context][g.key];return '<div class="level-card '+g.cls+(collapsed?' collapsed':'')+'" data-group="'+g.key+'"><button class="level-head" onclick="toggleGroup(\''+context+'\',\''+g.key+'\')"><span class="dot"></span><span>'+g.title+'</span><span class="fold">⌃</span></button><div class="level-body">'+items.map(wordHtml).join('')+'</div></div>'}).join('')
}
function toggleGroup(context,key){COLLAPSED[context][key]=!COLLAPSED[context][key];if(context==='words')renderWords();else renderVocabularyHistory()}
function renderWords(){wordList.innerHTML=groupHtml(DATA.words||[],false,'words')}
function showWords(){hidePages();words.classList.remove('hidden');renderWords();window.scrollTo(0,0)}
function showQuiz(){
 const qs=DATA.quizQuestions||[];hidePages();quiz.classList.remove('hidden');quizResult.classList.add('hidden');
 const cfg=DATA.config||{}, labels={GB_PL:'Angielski → polski',PL_GB:'Polski → angielski',CONTEXT:'Kontekst',FILL_GAP:'Uzupełnij lukę'};
 const types=(cfg.enabledQuizTypes||[]).map(x=>labels[x]||x).join(' • ');
 if(!qs.length){quizList.innerHTML='<div class="progress-card">Quiz dla tego batcha nie jest jeszcze gotowy.</div>';checkQuizBtn.classList.add('hidden');return}
 checkQuizBtn.classList.remove('hidden');checkQuizBtn.disabled=false;checkQuizBtn.textContent='SPRAWDŹ I ZAPISZ WYNIK';
 quizList.innerHTML='<div class="quiz-meta">Set '+DATA.setWeek+' • Batch '+DATA.batch+' • '+qs.length+' pytań'+(types?' • '+esc(types):'')+'</div>'+qs.map((q,i)=>{
   const title='<div class="quiz-no">Pytanie '+(i+1)+' z '+qs.length+'</div><div class="quiz-q">'+esc(q.question)+'</div>';
   if(q.type==='FILL_GAP')return '<div class="quiz-card">'+title+'<input class="quiz-input" data-qi="'+i+'" autocomplete="off" placeholder="Wpisz odpowiedź"></div>';
   return '<div class="quiz-card">'+title+q.options.map((o,j)=>o?'<label class="quiz-option"><input type="radio" name="q'+i+'" data-qi="'+i+'" value="'+['A','B','C','D'][j]+'"><span>'+esc(o)+'</span></label>':'').join('')+'</div>';
 }).join('');window.scrollTo(0,0);
}
function checkQuiz(){
  const qs=DATA.quizQuestions||[],answers=[];let answered=0;
  qs.forEach((q,i)=>{
    let v='';
    if(q.type==='FILL_GAP'){const el=document.querySelector('input[data-qi="'+i+'"]');v=String(el&&el.value||'').trim();}
    else{const el=document.querySelector('input[name="q'+i+'"]:checked');v=el?el.value:'';}
    if(v)answered++;answers.push(v);
  });
  checkQuizBtn.disabled=true;checkQuizBtn.textContent='ZAPISUJĘ WYNIK…';
  fetch('/api/quiz-submit',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({setWeek:DATA.setWeek,batch:DATA.batch,answers})})
    .then(async r=>{const x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'HTTP '+r.status);return x})
    .then(x=>{quizResult.classList.remove('hidden');quizResult.innerHTML='<span class="progress-icon">🏆</span><div><div class="progress-title">Wynik: '+Math.round(x.percent)+'%</div><div class="progress-sub">'+x.score+' / '+x.maxScore+' pkt • odpowiedzi '+answered+' / '+qs.length+' • zapisano próbę '+x.attemptNo+'</div></div>';quizResult.scrollIntoView({behavior:'smooth'});checkQuizBtn.textContent='WYNIK ZAPISANY';refreshStudentProgress().catch(()=>{});})
    .catch(e=>{checkQuizBtn.disabled=false;checkQuizBtn.textContent='SPRAWDŹ WYNIK';quizResult.classList.remove('hidden');quizResult.innerHTML='<div><div class="progress-title">Nie zapisano wyniku</div><div class="progress-sub">'+esc(e.message||e)+'</div></div>';});
}
function showVocabularyHistory(){hidePages();vocabularyHistory.classList.remove('hidden');VOCAB_SCOPE='set';LEVEL_FILTERS={a:true,b1:true,b2:true};syncVocabularyControls();renderVocabularyHistory();window.scrollTo(0,0)}
function setVocabularyScope(scope){VOCAB_SCOPE=scope;syncVocabularyControls();renderVocabularyHistory()}
function toggleLevelFilter(key){LEVEL_FILTERS[key]=!LEVEL_FILTERS[key];syncVocabularyControls();renderVocabularyHistory()}
function syncVocabularyControls(){scopeSet.classList.toggle('active',VOCAB_SCOPE==='set');scopeAll.classList.toggle('active',VOCAB_SCOPE==='all');filterA.classList.toggle('active',LEVEL_FILTERS.a);filterB1.classList.toggle('active',LEVEL_FILTERS.b1);filterB2.classList.toggle('active',LEVEL_FILTERS.b2)}
function renderVocabularyHistory(){const source=VOCAB_SCOPE==='set'?(DATA.currentSetWords||[]):(DATA.allSentWords||[]);historyWordList.innerHTML=groupHtml(source,true,'history')||'<div class="sub">Brak słówek dla wybranych filtrów.</div>'}
function levelGroup(level){const s=String(level||'').toUpperCase().replace(/\s/g,'');if(s.includes('B2')||s.includes('C1')||s.includes('C2'))return'b2';if(s.includes('B1'))return'b1';return'a'}
function speakWord(word){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.rate=.85;const v=speechSynthesis.getVoices();const p=v.find(x=>String(x.lang).toLowerCase().startsWith('en-gb'))||v.find(x=>String(x.lang).toLowerCase().startsWith('en'));if(p)u.voice=p;speechSynthesis.speak(u)}
function jsq(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]+/g,' ')}
function hidePages(){['home','words','quiz','vocabularyHistory','learningProgress'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function showHome(){if(window.speechSynthesis)speechSynthesis.cancel();hidePages();home.classList.remove('hidden');window.scrollTo(0,0)}
function fail(e){loading.classList.add('hidden');error.classList.remove('hidden');error.textContent='Nie udało się załadować danych: '+(e.message||e)}
let progressRequest=0;
async function refreshStudentProgress(){
 const response=await fetch(API_URL,{credentials:'same-origin',cache:'no-store'});
 if(response.status===401){showLogin();return null}
 if(!response.ok)throw new Error('HTTP '+response.status);
 const data=await response.json();DATA=data;return data;
}
async function showLearningProgress(){
 const request=++progressRequest;
 hidePages();learningProgress.classList.remove('hidden');
 learningProgressTitle.focus();window.scrollTo(0,0);
 learningProgressContent.innerHTML='';learningProgressState.textContent='Ładowanie postępu…';
 learningProgress.setAttribute('aria-busy','true');
 try{
  const data=await refreshStudentProgress();
  if(request!==progressRequest||learningProgress.classList.contains('hidden'))return;
  if(data)renderLearningProgress(data.learningProgress);
 }catch(e){
  if(request===progressRequest&&!learningProgress.classList.contains('hidden')){
   learningProgressState.textContent='Nie udało się pobrać postępu. Spróbuj ponownie.';
   learningProgressContent.innerHTML='<button onclick="showLearningProgress()">Spróbuj ponownie</button>';
  }
 }finally{if(request===progressRequest)learningProgress.setAttribute('aria-busy','false')}
}
function returnFromLearningProgress(){progressRequest++;showHome();learningProgressBtn.focus()}
function progressLevel(value){return value==null?'unknown':value>=90?'high':value>=70?'mid':'low'}
function progressPercent(value){return value==null?'—':value.toLocaleString('pl-PL',{maximumFractionDigits:1})+'%'}
function progressCounts(item){if(item.sentWords===0)return '0/0';return (item.masteredWords==null?'—':item.masteredWords)+'/'+item.sentWords}
function progressTrend(batch){
 const value=batch.trendPp;
 if(value==null)return '<p class="lp-note">Trend: —. '+esc(batch.trendReason||'Brak porównywalnych prób.')+'</p>';
 const direction=value>0?'up':value<0?'down':'flat';
 const label=value>0?'↑ Wzrost':value<0?'↓ Spadek':'→ Bez zmiany';
 return '<p class="lp-'+direction+'">'+label+' '+(value>0?'+':'')+value.toLocaleString('pl-PL',{maximumFractionDigits:1})+' pp</p>';
}
function progressBar(item,label,vertical){
 const value=item.masteryPercent;
 const known=value!=null;
 return '<div class="'+(vertical?'lp-column':'lp-track')+' lp-'+progressLevel(value)+'" role="progressbar" aria-label="'+esc(label)+'" aria-valuemin="0" aria-valuemax="100" '+(known?'aria-valuenow="'+value+'" ':'')+'aria-valuetext="'+esc(progressPercent(value)+'; opanowane/wysłane '+progressCounts(item))+'"><div class="lp-fill" style="'+(vertical?'height':'width')+':'+(known?Math.max(0,Math.min(100,value)):0)+'%"></div></div>';
}
function progressSetHtml(set){
 const level={high:'wysoki',mid:'średni',low:'niski',unknown:'nieznany'};
 return '<article class="lp-set" data-progress-set="'+esc(set.setWeek)+'"><h2>Set '+esc(set.setWeek)+'</h2><p>'+(set.fullySent?'Wysłany w całości':'Wysyłka nieukończona')+' • Quizy: '+set.quizzesCompleted+'/'+set.plannedBatches+'</p><p>Opanowanie: '+progressPercent(set.masteryPercent)+' • '+progressCounts(set)+' opanowanych/wysłanych • poziom '+level[progressLevel(set.masteryPercent)]+'</p><p>Trudne: '+(set.difficultWords==null?'—':set.difficultWords)+'</p>'+progressBar(set,'Opanowanie setu '+set.setWeek,false)+(set.incomplete?'<p class="lp-note">Niekompletne dane historyczne.</p>':'')+(set.availabilityReason?'<p class="lp-note">'+esc(set.availabilityReason)+'</p>':'')+'<div class="lp-batches">'+set.batches.map(b=>'<article class="lp-batch" data-progress-batch="'+b.batch+'"><h3>Batch '+b.batch+'</h3>'+progressBar(b,'Set '+set.setWeek+', batch '+b.batch,true)+'<p>'+progressPercent(b.masteryPercent)+' • '+progressCounts(b)+' opanowanych/wysłanych</p><p>Poziom: '+level[progressLevel(b.masteryPercent)]+' • Trudne: '+(b.difficultWords==null?'—':b.difficultWords)+'</p><p>'+(b.completed?'Wykonany':b.fullySent?'Wysłany • quiz niewykonany':'Wysyłka nieukończona')+'</p>'+progressTrend(b)+(b.availabilityReason?'<p class="lp-note">'+esc(b.availabilityReason)+'</p>':'')+'</article>').join('')+'</div></article>';
}
function renderLearningProgress(progress){
 if(!progress||!progress.summary||!Array.isArray(progress.sets))throw new Error('Brak kontraktu postępu');
 const sent=progress.sets.filter(s=>s.lastSentAt).slice().sort((a,b)=>new Date(b.lastSentAt)-new Date(a.lastSentAt)||b.setWeek-a.setWeek);
 learningProgressState.textContent=sent.length?(progress.incomplete?'Niektóre dane historyczne są niekompletne.':''):'Brak potwierdzonych wysłanych danych.'+(progress.incomplete?' Niekompletne dane historyczne.':'');
 const labels={setsCompleted:'Sety wykonane',batchesSent:'Batche wysłane',quizzesCompleted:'Quizy wykonane'};
 learningProgressContent.innerHTML='<div class="lp-counters">'+Object.keys(labels).map(k=>'<div class="lp-counter">'+labels[k]+'<strong data-progress-counter="'+k+'">'+progress.summary[k]+'</strong></div>').join('')+sent.slice(0,2).map(progressSetHtml).join('')+(sent.length>2?'<details id="learningProgressHistory"><summary>Pokaż wcześniejsze sety</summary>'+sent.slice(2).map(progressSetHtml).join('')+'</details>':'');
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body></html>
