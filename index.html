<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English B1 — Student</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}
body{margin:0}.wrap{max-width:900px;margin:auto;padding:28px 18px}
header{background:#fff;border-radius:20px;padding:24px;box-shadow:0 6px 24px #0001}
h1{margin:0 0 8px}.muted{color:#64748b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;min-height:110px}
.green{background:#effbf3;border-color:#b4e8c5;color:#096f35}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#e2e8f0;font-size:13px}
#status{margin-top:18px;padding:14px;border-radius:12px;background:#fff}
</style>
</head>
<body><main class="wrap">
<header><span class="badge">DEV</span><h1>English B1 — Student</h1><div class="muted">Frontend testowy poza script.google.com</div></header>
<section class="cards">
<div class="card green"><h2>Uczę się słówek</h2><p>Lista słówek i nauka.</p></div>
<div class="card"><h2>Quiz</h2><p>Test wiedzy.</p></div>
<div class="card"><h2>MP3</h2><p>Ćwiczenia ze słuchu.</p></div>
<div class="card"><h2>Wszystkie słówka</h2><p>Historia i postęp.</p></div>
</section>
<div id="status"><strong>Test hostingu:</strong> strona działa niezależnie od Google Apps Script.</div>
</main></body></html>
